<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit User - AI Bug Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f5eaff 50%, #e0f2fe 100%);
            color: #2d2850;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(110deg, #6c4bd3, #4779df);
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 5px 18px rgba(91, 75, 180, 0.22);
        }

        .navbar h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .nav-links a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .logout-btn {
            border: none;
            background: linear-gradient(135deg, #ff6b81, #e8436b);
            color: white;
            padding: 10px 17px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(232, 67, 107, 0.2);
            transition: transform 0.2s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
        }

        /* Main Container */
        .container {
            width: 92%;
            max-width: 700px;
            margin: 45px auto;
        }

        /* Edit User Card */
        .card {
            background: rgba(255, 255, 255, 0.88);
            padding: 35px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 35px rgba(94, 76, 160, 0.12);
            backdrop-filter: blur(12px);
        }

        .card h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 30px;
            color: #5b3bbd;
            font-weight: 750;
        }

        .card p {
            color: #77718f;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Form Fields */
        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: 700;
            color: #43376e;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ded7f5;
            border-radius: 11px;
            font-size: 15px;
            color: #30284d;
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #8b6be8;
            box-shadow: 0 0 0 4px rgba(139, 107, 232, 0.13);
        }

        /* Read-only User ID */
        .readonly {
            background: #f0edfa;
            color: #77718f;
            border-color: #e3dcf7;
            cursor: not-allowed;
        }

        /* Buttons */
        .button-row {
            display: flex;
            gap: 13px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .save-btn {
            background: linear-gradient(135deg, #8056df, #4e7ce8);
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 11px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 5px 14px rgba(100, 83, 205, 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(100, 83, 205, 0.3);
        }

        .cancel-btn {
            background: #ede9f8;
            color: #5d4a91;
            text-decoration: none;
            padding: 13px 24px;
            border-radius: 11px;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid #ddd4f4;
            transition: background 0.2s ease;
        }

        .cancel-btn:hover {
            background: #ded5f4;
        }

        /* Error Message */
        .error {
            background: #fff0f1;
            color: #b42342;
            padding: 14px 16px;
            border: 1px solid #ffcbd4;
            border-radius: 11px;
            margin-bottom: 22px;
            font-weight: 600;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .navbar {
                padding: 18px 20px;
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-links {
                gap: 13px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .card {
                padding: 24px 20px;
                border-radius: 17px;
            }

            .card h1 {
                font-size: 25px;
            }

            .button-row {
                flex-direction: column;
            }

            .save-btn,
            .cancel-btn {
                width: 100%;
                text-align: center;
            }
        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>🐞 AI Bug Tracker</h2>

    <div class="nav-links">

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/projects">
            Projects
        </a>

        <a href="/bugs">
            Bugs
        </a>

        <a href="/users">
            Users
        </a>

        <form th:action="@{/logout}"
              method="post"
              style="display:inline;">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    class="logout-btn">
                Logout
            </button>

        </form>

    </div>

</div>


<div class="container">

    <div class="card">

        <h1>Edit User</h1>

        <p>
            Update user information and assigned role.
        </p>


        <div th:if="${error}"
             class="error"
             th:text="${error}">
            Error message
        </div>


        <form th:action="@{/users/edit/{id}(id=${user.id})}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <!-- User ID -->

            <div class="form-group">

                <label>User ID</label>

                <input type="text"
                       th:value="${user.id}"
                       class="readonly"
                       readonly>

            </div>


            <!-- Name -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input type="text"
                       id="name"
                       name="name"
                       th:value="${user.name}"
                       required>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       th:value="${user.email}"
                       required>

            </div>


            <!-- Role -->

            <div class="form-group">

                <label for="role">
                    Role
                </label>

                <select id="role"
                        name="role"
                        required>

                    <option th:each="role : ${roles}"
                            th:value="${role}"
                            th:text="${role}"
                            th:selected="${role == user.role}">
                    </option>

                </select>

            </div>


            <div class="button-row">

                <button type="submit"
                        class="save-btn">
                    Save Changes
                </button>

                <a href="/users"
                   class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
