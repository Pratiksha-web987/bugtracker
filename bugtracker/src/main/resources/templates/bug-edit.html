<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Edit Bug</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #fdf2f8, #e0f2fe);
            color: #334155;
        }

        h1 {
            text-align: center;
            color: #5b21b6;
            font-size: 32px;
            margin-bottom: 30px;
        }

        form {
            max-width: 750px;
            margin: auto;
            padding: 35px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(99, 102, 241, 0.12);
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: 600;
            color: #4c1d95;
            font-size: 15px;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 22px;
            border: 1px solid #d8ccf5;
            border-radius: 10px;
            background: #faf9ff;
            color: #334155;
            font: inherit;
            outline: none;
            transition: 0.2s ease;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
            background: #fff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
        }

        a {
            display: block;
            width: fit-content;
            margin: 22px auto 0;
            padding: 11px 25px;
            border-radius: 10px;
            background: #ede9fe;
            color: #6d28d9;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s ease;
        }

        a:hover {
            background: #ddd6fe;
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 14px;
            }

            form {
                padding: 22px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<h1>Edit Bug</h1>

<form th:action="@{/bugs/{id}/update(id=${bug.id})}"
      method="post">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <label>Bug Title:</label>

    <input type="text"
           name="title"
           th:value="${bug.title}"
           required>

    <br><br>


    <label>Description:</label>

    <textarea name="description"
              rows="5"
              required
              th:text="${bug.description}">
    </textarea>

    <br><br>


    <label>Steps to Reproduce:</label>

    <textarea name="stepsToReproduce"
              rows="5"
              th:text="${bug.stepsToReproduce}">
    </textarea>

    <br><br>


    <label>Expected Result:</label>

    <textarea name="expectedResult"
              rows="4"
              th:text="${bug.expectedResult}">
    </textarea>

    <br><br>


    <label>Actual Result:</label>

    <textarea name="actualResult"
              rows="4"
              th:text="${bug.actualResult}">
    </textarea>

    <br><br>


    <label>Priority:</label>

    <select name="priority" required>

        <option th:each="priority : ${priorities}"
                th:value="${priority}"
                th:text="${priority}"
                th:selected="${priority == bug.priority}">
        </option>

    </select>

    <br><br>


    <label>Severity:</label>

    <select name="severity" required>

        <option th:each="severity : ${severities}"
                th:value="${severity}"
                th:text="${severity}"
                th:selected="${severity == bug.severity}">
        </option>

    </select>

    <br><br>


    <label>Category:</label>

    <input type="text"
           name="category"
           th:value="${bug.category}">

    <br><br>


    <button type="submit">
        Update Bug
    </button>

</form>

<br>

<a th:href="@{/bugs/{id}(id=${bug.id})}">
    Cancel
</a>

</body>

</html>
