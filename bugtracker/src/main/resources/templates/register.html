<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - AI Bug Project</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #fdf2f8, #e0f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 25px 16px;
            color: #334155;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.88);
            width: 100%;
            max-width: 440px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        h1 {
            text-align: center;
            margin-bottom: 28px;
            color: #5b21b6;
            font-size: 30px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #4c1d95;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d8ccf5;
            border-radius: 10px;
            font-size: 15px;
            color: #334155;
            background: #faf9ff;
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #9ca3af;
        }

        input:focus,
        select:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
            background: #ffffff;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            color: #ffffff;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
        }

        .error {
            background: #fff1f2;
            color: #be123c;
            padding: 13px 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #fecdd3;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #64748b;
        }

        .login-link a {
            color: #7c3aed;
            font-weight: 700;
            text-decoration: none;
            margin-left: 4px;
        }

        .login-link a:hover {
            color: #4f46e5;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 26px 20px;
                border-radius: 16px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <h1>Create Account</h1>

    <div th:if="${error}" class="error">
        <span th:text="${error}"></span>
    </div>

    <form action="/register" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-group">
            <label>User ID</label>
            <input type="number"
                   name="id"
                   placeholder="Enter User ID"
                   min="1"
                   required>
        </div>
        <div class="form-group">
            <label>Name</label>
            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter password"
                   required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password"
                   name="confirmPassword"
                   placeholder="Confirm password"
                   required>
        </div>

        <button type="submit">
            Register
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login">Login</a>
    </div>

</div>

</body>
</html>
