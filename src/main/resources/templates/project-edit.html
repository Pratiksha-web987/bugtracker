<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project - AI Bug Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                    135deg,
                    #dff7ff 0%,
                    #fce7f3 35%,
                    #ede9fe 65%,
                    #dbeafe 100%
            );
            background-attachment: fixed;
            color: #172554;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .form-card {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.94);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 35px rgba(51, 65, 85, 0.13);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 30px;
            color: #312e81;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin: 0 0 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #334155;
            font-size: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d8d9ef;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            color: #1e293b;
            background: #fafaff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
            background: #fff;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .submit-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 11px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(99, 102, 241, 0.22);
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #6d28d9);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(99, 102, 241, 0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #6d28d9;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .back-link:hover {
            color: #4338ca;
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .form-card {
                padding: 24px 18px;
            }

            h1 {
                font-size: 25px;
            }

            .date-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<div class="form-card">

    <h1>✏️ Edit Project</h1>

    <p class="subtitle">
        Update your project details below.
    </p>

    <form th:action="@{/projects/update/{id}(id=${project.id})}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-group">
            <label>Project Name:</label>
            <input type="text"
                   name="name"
                   th:value="${project.name}"
                   required>
        </div>

        <div class="form-group">
            <label>Description:</label>
            <textarea name="description"
                      th:text="${project.description}"></textarea>
        </div>

        <div class="form-group">
            <label>Project Type:</label>
            <select name="projectType" required>
                <option th:each="type : ${projectTypes}"
                        th:value="${type}"
                        th:text="${type}"
                        th:selected="${type == project.projectType}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Project URL:</label>
            <input type="url"
                   name="projectUrl"
                   th:value="${project.projectUrl}"
                   placeholder="https://example.com">
        </div>

        <div class="date-row">
            <div class="form-group">
                <label>Start Date:</label>
                <input type="date"
                       name="startDate"
                       th:value="${project.startDate}"
                       required>
            </div>

            <div class="form-group">
                <label>End Date:</label>
                <input type="date"
                       name="endDate"
                       th:value="${project.endDate}"
                       required>
            </div>
        </div>

        <div class="form-group">
            <label>Status:</label>
            <select name="status" required>
                <option th:each="status : ${projectStatuses}"
                        th:value="${status}"
                        th:text="${status}"
                        th:selected="${status == project.status}">
                </option>
            </select>
        </div>

        <button type="submit" class="submit-btn">
            Update Project
        </button>

    </form>

    <a href="/projects" class="back-link">
        ← Back to Projects
    </a>

</div>

</body>
</html>
