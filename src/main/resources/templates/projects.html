<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .container {
            width: 95%;
            max-width: 1300px;
            margin: 35px auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .create-btn {
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .create-btn:hover {
            background: #1d4ed8;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1f2937;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8fafc;
        }

        .action-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }
        .test-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .test-btn:hover {
            background: #15803d;
        }
        .open-test-btn {
            display: inline-block;
            background: #7c3aed;
            color: white;
            padding: 8px 14px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .open-test-btn:hover {
            background: #6d28d9;
        }

        .test-result {
            margin-top: 10px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 6px;
            white-space: pre-line;
            font-size: 13px;
        }

        .logout-btn {
            border: none;
            background: #dc2626;
            color: white;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }

        /* ================= VIBRANT PROJECTS THEME ================= */

        /* Background */
        body {
            background: linear-gradient(
                    135deg,
                    #dff7ff 0%,
                    #fce7f3 35%,
                    #ede9fe 65%,
                    #dbeafe 100%
            );
            background-attachment: fixed;
            color: #172554;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(
                    110deg,
                    #111b55,
                    #312e81,
                    #6d28d9
            );
            box-shadow: 0 5px 20px rgba(49, 46, 129, 0.25);
        }

        .nav-links {
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-links a {
            padding: 9px 12px;
            border-radius: 10px;
            transition: all 0.25s ease;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.16);
            text-decoration: none;
            transform: translateY(-2px);
        }

        /* Page heading */
        .page-header h1 {
            color: #312e81;
            font-weight: 800;
        }

        .page-header p {
            color: #64748b;
        }

        /* Create project button */
        .create-btn {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 10px;
            box-shadow: 0 5px 12px rgba(99, 102, 241, 0.2);
            transition: all 0.25s ease;
        }

        .create-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #6d28d9);
            transform: translateY(-2px);
        }

        /* Table container */
        .table-container {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(51, 65, 85, 0.09);
            backdrop-filter: blur(10px);
        }

        /* Table header */
        th {
            background: linear-gradient(135deg, #312e81, #6d28d9);
            color: white;
            border: none;
            padding: 15px 14px;
        }

        /* Table rows */
        td {
            color: #334155;
            border-bottom: 1px solid #e9e7f5;
        }

        tbody tr:hover {
            background: #f0f4ff;
        }

        /* Action links */
        .action-link {
            color: #6d28d9;
            font-weight: 700;
        }

        .action-link:hover {
            color: #4338ca;
        }

        /* Automated test button */
        .test-btn {
            background: linear-gradient(135deg, #0d9488, #10b981);
            border-radius: 9px;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.18);
            transition: all 0.25s ease;
        }

        .test-btn:hover {
            background: linear-gradient(135deg, #0f766e, #059669);
            transform: translateY(-2px);
        }

        /* Open test dashboard */
        .open-test-btn {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-radius: 9px;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.18);
            transition: all 0.25s ease;
        }

        .open-test-btn:hover {
            background: linear-gradient(135deg, #6d28d9, #9333ea);
            transform: translateY(-2px);
        }

        /* Automated test result */
        .test-result {
            background: #ede9fe;
            color: #4c1d95;
            border: 1px solid #ddd6fe;
            border-radius: 10px;
            line-height: 1.6;
        }

        /* Delete button */
        .delete-btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            border-radius: 9px;
            transition: all 0.25s ease;
        }

        .delete-btn:hover {
            background: linear-gradient(135deg, #e11d48, #be123c);
            transform: translateY(-2px);
        }

        /* Logout button */
        .logout-btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            border-radius: 9px;
            transition: all 0.25s ease;
        }

        .logout-btn:hover {
            background: linear-gradient(135deg, #e11d48, #be123c);
            transform: translateY(-2px);
        }

        /* Responsive table */
        .table-container {
            overflow-x: auto;
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 18px 20px;
            }

            .page-header {
                align-items: flex-start;
            }

            .create-btn {
                display: inline-block;
            }
        }
    </style>
</head>

<body>
<div class="navbar">

    <h2>🐞AI Bug Tracker</h2>

    <div class="nav-links">

        <a href="/dashboard">Dashboard</a>
        <a href="/projects">Projects</a>
        <a href="/bugs">Bugs</a>
        <a href="/bugs/new">Report Bug</a>

        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit" class="logout-btn">
                Logout
            </button>
        </form>

    </div>

</div>
<div class="container">

    <div class="page-header">

        <div>
            <h1>Projects</h1>
            <p>Manage and monitor your projects.</p>
        </div>

        <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''PROJECT_MANAGER'')')}"
           href="/projects/new"
           class="create-btn">
            + Create New Project
        </a>
    </div>

    <div class="table-container">
<table>

    <thead>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Status</th>
        <th>URL</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Action</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="project : ${projects}">

        <td th:text="${project.id}"></td>

        <td th:text="${project.name}"></td>

        <td th:text="${project.projectType}"></td>

        <td th:text="${project.status}"></td>

        <td>
            <a th:if="${project.projectUrl != null
                       and !project.projectUrl.isEmpty()}"
               th:href="${project.projectUrl}"
               target="_blank">
                Open Project
            </a>

            <span th:if="${project.projectUrl == null
                          or project.projectUrl.isEmpty()}">
                Internal Project
            </span>
        </td>

        <td th:text="${project.startDate}"></td>

        <td th:text="${project.endDate}"></td>

        <td>

            <a th:href="@{/projects/{id}(id=${project.id})}"
               class="action-link">
                View Details
            </a>

            <br><br>

            <button th:if="${project.projectType != null
                 and project.projectType.name() == 'EXTERNAL'
                 and project.projectUrl != null
                 and !project.projectUrl.isEmpty()}"
                    type="button"
                    class="test-btn"
                    th:attr="onclick=|runExternalTest(${project.id})|">
                ▶ Run Automated Test
            </button>

            <br><br>

            <a th:if="${project.projectType != null
           and project.projectType.name() == 'EXTERNAL'
           and project.projectUrl != null
           and !project.projectUrl.isEmpty()}"
               th:href="@{/external-testing/{id}(id=${project.id})}"
               class="open-test-btn">
                🧪 Open Test Dashboard
            </a>

            <div th:id="'test-result-' + ${project.id}"
                 class="test-result"
                 style="display:none;">
            </div>

            <br><br>
            <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''PROJECT_MANAGER'')')}"
               th:href="@{/projects/edit/{id}(id=${project.id})}"
               class="action-link">
                Edit
            </a>

            <br><br>
            <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''PROJECT_MANAGER'')')}"
               th:href="@{/projects/{id}/team(id=${project.id})}"
               class="action-link">
                Manage Team
            </a>

            <br><br>

            <form th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''PROJECT_MANAGER'')')}"
                  th:action="@{/projects/delete/{id}(id=${project.id})}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit" class="delete-btn">
                    Delete
                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>
    </div>

    <script>
        async function runExternalTest(projectId) {

            const resultBox =
                document.getElementById("test-result-" + projectId);

            resultBox.style.display = "block";
            resultBox.innerText =
                "⏳ Automated test running...\nPlease wait.";

            try {

                const response = await fetch(
                    "/external-testing/run/" + projectId,
                    {
                        method: "GET"
                    }
                );

                const result = await response.text();

                resultBox.innerText = result;

            } catch (error) {

                resultBox.innerText =
                    "❌ Unable to run automated test.\n"
                    + error.message;
            }
        }
    </script>
</div>
</body>

</html>
