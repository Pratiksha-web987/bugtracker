<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Bug</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(
                    135deg,
                    #e0e7ff,
                    #fce7f3,
                    #ede9fe
            );
            color: #334155;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 32px;
            color: #6d28d9;
            margin-bottom: 10px;
        }

        .header p {
            color: #64748b;
            font-size: 15px;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.88);
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(91, 33, 182, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .section-title {
            font-size: 19px;
            font-weight: 700;
            color: #6d28d9;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 2px solid #ede9fe;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: #475569;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd6fe;
            border-radius: 11px;
            background: #faf9ff;
            color: #334155;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.25s ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #8b5cf6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 24px;
            border: none;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .btn-primary {
            color: white;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            box-shadow: 0 5px 14px rgba(109, 40, 217, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(109, 40, 217, 0.28);
        }

        .btn-secondary {
            background: #f3e8ff;
            color: #6d28d9;
        }

        .btn-secondary:hover {
            background: #e9d5ff;
            transform: translateY(-2px);
        }

        .bottom-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .bottom-links a {
            color: #6d28d9;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .bottom-links a:hover {
            color: #4f46e5;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 14px;
            }

            .form-card {
                padding: 22px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .header h1 {
                font-size: 26px;
            }

            .form-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🐞 Report New Bug</h1>
        <p>Submit a bug report with details to help your team resolve the issue.</p>
    </div>

    <div class="form-card">

        <form action="/bugs" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <h2 class="section-title">Bug Information</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>Bug ID:</label>
                    <input type="number"
                           name="id"
                           placeholder="Enter Bug ID"
                           min="1"
                           required>
                </div>

                <div class="form-group">
                    <label>Bug Title:</label>
                    <input type="text"
                           name="title"
                           placeholder="Enter bug title"
                           required>
                </div>

                <div class="form-group full-width">
                    <label>Description:</label>
                    <textarea name="description"
                              rows="5"
                              placeholder="Describe the bug in detail..."
                              required></textarea>
                </div>

                <div class="form-group full-width">
                    <label>Steps to Reproduce:</label>
                    <textarea name="stepsToReproduce"
                              rows="5"
                              placeholder="Enter the steps to reproduce the bug..."></textarea>
                </div>

                <div class="form-group">
                    <label>Expected Result:</label>
                    <textarea name="expectedResult"
                              rows="4"
                              placeholder="What should happen?"></textarea>
                </div>

                <div class="form-group">
                    <label>Actual Result:</label>
                    <textarea name="actualResult"
                              rows="4"
                              placeholder="What actually happened?"></textarea>
                </div>

            </div>

            <h2 class="section-title" style="margin-top: 32px;">
                Project & Classification
            </h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>Project:</label>
                    <select name="projectId" required>
                        <option value="">-- Select Project --</option>
                        <option th:each="project : ${projects}"
                                th:value="${project.id}"
                                th:text="${project.name}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Reported By:</label>
                    <select name="reportedById" required>
                        <option value="">-- Select User --</option>
                        <option th:each="user : ${users}"
                                th:value="${user.id}"
                                th:text="${user.name + ' (' + user.email + ')'}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Priority:</label>
                    <select name="priority" required>
                        <option th:each="priority : ${priorities}"
                                th:value="${priority}"
                                th:text="${priority}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Severity:</label>
                    <select name="severity" required>
                        <option th:each="severity : ${severities}"
                                th:value="${severity}"
                                th:text="${severity}">
                        </option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Category:</label>
                    <input type="text"
                           name="category"
                           placeholder="UI, Functional, Security, Performance">
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    🐞 Report Bug
                </button>

                <a href="/bugs" class="btn btn-secondary">
                    View All Bugs
                </a>

                <a href="/projects" class="btn btn-secondary">
                    Back to Projects
                </a>
            </div>

        </form>

    </div>

    <div class="bottom-links">
        <a href="/bugs">← All Bugs</a>
        <a href="/projects">← Projects</a>
    </div>

</div>

</body>
</html>
