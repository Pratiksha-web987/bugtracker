<!DOCTYPE html><html lang="en"
                     xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Management - AI Bug Tracker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #fdf2f8, #e0f2fe);
            color: #334155;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, #6d28d9, #3b82f6);
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 5px 20px rgba(79, 70, 229, 0.2);
        }

        .navbar h2 {
            margin: 0;
            font-size: 23px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .nav-links a:hover {
            color: #ddd6fe;
        }

        .logout-btn {
            border: none;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: white;
            padding: 10px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(225, 29, 72, 0.25);
        }

        /* Main Container */
        .container {
            width: 95%;
            max-width: 1250px;
            margin: 35px auto;
        }

        .page-header {
            margin-bottom: 25px;
            padding: 25px 28px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.08);
        }

        .page-header h1 {
            margin: 0 0 10px;
            color: #5b21b6;
            font-size: 30px;
        }

        .page-header p {
            color: #64748b;
            margin: 0;
            line-height: 1.6;
        }

        /* Table */
        .table-container {
            background: rgba(255, 255, 255, 0.88);
            padding: 22px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: linear-gradient(135deg, #6d28d9, #4f46e5);
            color: white;
            padding: 15px;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
        }

        th:first-child {
            border-radius: 9px 0 0 0;
        }

        th:last-child {
            border-radius: 0 9px 0 0;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ede9fe;
            font-size: 14px;
            vertical-align: middle;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: #f5f3ff;
        }

        /* Role Select */
        select {
            padding: 9px 12px;
            border: 1px solid #d8ccf5;
            border-radius: 8px;
            background: #faf9ff;
            color: #4c1d95;
            font: inherit;
            outline: none;
            margin-right: 6px;
        }

        select:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
        }

        /* Buttons */
        .update-btn {
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .update-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(124, 58, 237, 0.2);
        }

        .delete-btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .delete-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(225, 29, 72, 0.2);
        }

        .edit-btn {
            display: inline-block;
            background: #ede9fe;
            color: #6d28d9;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            margin: 0 5px 5px 0;
            transition: 0.2s ease;
        }

        .edit-btn:hover {
            background: #ddd6fe;
            transform: translateY(-1px);
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #6d28d9;
            text-decoration: none;
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 9px;
            background: #ede9fe;
            transition: 0.2s ease;
        }

        .back-link:hover {
            background: #ddd6fe;
            transform: translateY(-1px);
        }

        /* Current User */
        td strong {
            display: inline-block;
            padding: 7px 11px;
            border-radius: 8px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 12px;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 14px;
            }

            .container {
                width: 94%;
                margin: 22px auto;
            }

            .page-header {
                padding: 20px;
            }

            .page-header h1 {
                font-size: 25px;
            }

            .table-container {
                padding: 12px;
            }
        }
    </style>

</head><body><div class="navbar"><h2>🐞AI Bug Tracker</h2>

    <div class="nav-links">

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/projects">
            Projects
        </a>

        <a href="/bugs">
            Bugs
        </a>

        <a href="/users">
            Users
        </a>

        <form th:action="@{/logout}"
              method="post"
              style="display:inline;">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    class="logout-btn">
                Logout
            </button>

        </form>

    </div>

</div><div class="container"><div class="page-header">

    <h1>User Management</h1>

    <p>
        Manage users and their assigned roles.
    </p>

</div>

    <div class="table-container">

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Current Role</th>
                <th>Change Role</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="user : ${users}">

                <td th:text="${user.id}">
                    1
                </td>

                <td th:text="${user.name}">
                    User
                </td>

                <td th:text="${user.email}">
                    user@email.com
                </td>

                <td th:text="${user.role}">
                    DEVELOPER
                </td>

                <td>

                    <form th:action="@{/users/{id}/role(id=${user.id})}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <select name="role"
                                required>

                            <option th:each="role : ${T(com.aitracker.bugtracker.entity.Role).values()}"
                                    th:value="${role}"
                                    th:text="${role}"
                                    th:selected="${role == user.role}">
                            </option>

                        </select>

                        <button type="submit"
                                class="update-btn">
                            Update
                        </button>

                    </form>

                </td>

                <td>
    <span th:if="${user.id != currentUser.id}">
        <a th:if="${user.id != currentUser.id}"
           th:href="@{/users/edit/{id}(id=${user.id})}"
           class="edit-btn">
             Edit
        </a>
    <form th:action="@{/users/delete/{id}(id=${user.id})}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit"
                class="delete-btn">
            Delete
        </button>

    </form>
</span>

                    <span th:if="${user.id == currentUser.id}">
    <strong>Current User</strong>
</span>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(users)}">

                <td colspan="6">
                    No users found.
                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <a href="/dashboard"
       class="back-link">
        ← Back to Dashboard
    </a>

</div></body></html>
