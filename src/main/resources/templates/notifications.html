<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | AI Bug Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f5eaff 50%, #e0f2fe 100%);
            color: #2d2850;
            min-height: 100vh;
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            padding: 26px 28px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.1);
            backdrop-filter: blur(12px);
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
            color: #5b21b6;
            font-weight: 750;
        }

        .header p {
            margin: 9px 0 0;
            color: #77718f;
            line-height: 1.6;
        }

        /* Header Actions */
        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .actions form {
            margin: 0;
        }

        .btn {
            display: inline-block;
            border: none;
            padding: 12px 17px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8056df, #4e7ce8);
            color: white;
            box-shadow: 0 5px 14px rgba(100, 83, 205, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(100, 83, 205, 0.3);
        }

        .btn-secondary {
            background: #ede9f8;
            color: #5d4a91;
            border: 1px solid #ddd4f4;
        }

        .btn-secondary:hover {
            background: #ded5f4;
            transform: translateY(-2px);
        }

        /* Unread Count */
        .top-count {
            display: inline-block;
            margin-top: 12px;
            padding: 7px 13px;
            background: linear-gradient(135deg, #ffe4e9, #fce7f3);
            color: #be185d;
            border: 1px solid #fbcfe8;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        /* Notification Cards */
        .notification-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e8e1f8;
            border-radius: 16px;
            padding: 22px 24px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 6px 18px rgba(99, 102, 241, 0.07);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .notification-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.13);
        }

        /* Unread Notification */
        .notification-card.unread {
            border-left: 5px solid #8056df;
            background: linear-gradient(110deg, #faf5ff, #ffffff);
        }

        /* Notification Text */
        .notification-title {
            margin: 0 0 9px;
            font-size: 17px;
            font-weight: 750;
            color: #5b21b6;
            line-height: 1.5;
        }

        .notification-message {
            margin: 0;
            color: #5f5a78;
            line-height: 1.7;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .notification-time {
            margin-top: 11px;
            color: #8b84a5;
            font-size: 13px;
        }

        /* Read and Unread Badges */
        .read-badge,
        .unread-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .read-badge {
            background: linear-gradient(135deg, #dcfce7, #d1fae5);
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .unread-badge {
            background: linear-gradient(135deg, #ede9fe, #dbeafe);
            color: #5b3bbd;
            border: 1px solid #c4b5fd;
        }

        /* Mark as Read Button */
        .read-form {
            margin: 0;
            flex-shrink: 0;
        }

        .read-btn {
            padding: 10px 15px;
            border: 1px solid #c4b5fd;
            background: linear-gradient(135deg, #f5f3ff, #eff6ff);
            color: #5b3bbd;
            border-radius: 9px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .read-btn:hover {
            background: #e9e2ff;
            transform: translateY(-2px);
        }

        /* Empty State */
        .empty-state {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 65px 25px;
            text-align: center;
            color: #77718f;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.08);
        }

        .empty-state .icon {
            font-size: 50px;
            margin-bottom: 18px;
        }

        .empty-state h3 {
            color: #5b21b6;
            font-size: 23px;
            margin: 0 0 12px;
        }

        .empty-state p {
            margin: 0;
            line-height: 1.7;
            font-size: 14px;
        }

        /* Responsive Design */
        @media (max-width: 700px) {
            .container {
                margin: 25px auto;
                padding: 0 14px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                padding: 22px;
            }

            .header h1 {
                font-size: 26px;
            }

            .actions {
                width: 100%;
            }

            .actions form {
                flex: 1;
            }

            .btn-primary,
            .btn-secondary {
                text-align: center;
            }

            .notification-card {
                flex-direction: column;
                align-items: flex-start;
                padding: 20px;
            }

            .read-form {
                width: 100%;
            }

            .read-btn {
                width: 100%;
            }
        }

        @media (max-width: 420px) {
            .actions {
                flex-direction: column;
                align-items: stretch;
            }

            .actions form {
                width: 100%;
            }

            .actions .btn {
                width: 100%;
                text-align: center;
            }

            .header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <h1>🔔 Notifications</h1>

            <p>
                Stay updated with your project activities and bug workflow.
            </p>

            <span class="top-count"
                  th:if="${unreadCount > 0}"
                  th:text="${unreadCount + ' unread'}">
                0 unread
            </span>
        </div>

        <div class="actions">

            <form th:action="@{/notifications/read-all}"
                  method="post"
                  th:if="${unreadCount > 0}">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="btn btn-primary">
                    Mark All as Read
                </button>
            </form>

            <a href="/dashboard"
               class="btn btn-secondary"
               style="text-decoration:none;">
                Dashboard
            </a>

        </div>

    </div>


    <!-- Empty State -->

    <div class="empty-state"
         th:if="${#lists.isEmpty(notifications)}">

        <div class="icon">🔕</div>

        <h3>No notifications yet</h3>

        <p>
            You're all caught up. New project and bug updates
            will appear here.
        </p>

    </div>


    <!-- Notification List -->

    <div th:each="notification : ${notifications}"
         class="notification-card"
         th:classappend="${!notification.read} ? ' unread' : ''">

        <div>

            <h3 class="notification-title"
                th:text="${notification.title}">
                Notification Title
            </h3>

            <p class="notification-message"
               th:text="${notification.message}">
                Notification message
            </p>

            <div class="notification-time"
                 th:text="${#temporals.format(notification.createdAt, 'dd MMM yyyy, hh:mm a')}">
                01 Jan 2026, 10:30 AM
            </div>

            <span th:if="${notification.read}"
                  class="read-badge">
                ✓ Read
            </span>

            <span th:unless="${notification.read}"
                  class="unread-badge">
                ● Unread
            </span>

        </div>


        <!-- Mark Single Notification as Read -->

        <form th:if="${!notification.read}"
              th:action="@{/notifications/{id}/read(id=${notification.id})}"
              method="post"
              class="read-form">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    class="read-btn">
                Mark as Read
            </button>

        </form>

    </div>

</div>

</body>
</html>
